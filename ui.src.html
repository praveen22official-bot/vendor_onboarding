<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vendor Compliance & Onboarding Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Minimalist Enterprise Office UI
   Clean, dense, high-contrast B2B workspace for analysts and procurement teams.
   ========================================================================== */
:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;

  /* Office Light Theme (Clean Crisp Gray / Neutral Slate) */
  --bg-app: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --bg-hover: #E2E8F0;

  --border-subtle: #E2E8F0;
  --border-strong: #CBD5E1;
  --border-focus: #0284C7;

  --text-main: #0F172A;
  --text-muted: #475569;
  --text-subtle: #64748B;
  --text-inverse: #FFFFFF;

  /* Semantic Statuses (High-contrast, clean enterprise badges) */
  --brand-primary: #0284C7;
  --brand-hover: #0369A1;

  --status-ok-bg: #F0FDF4;
  --status-ok-border: #BBF7D0;
  --status-ok-text: #166534;

  --status-warn-bg: #FFFBEB;
  --status-warn-border: #FDE68A;
  --status-warn-text: #92400E;

  --status-bad-bg: #FEF2F2;
  --status-bad-border: #FECACA;
  --status-bad-text: #991B1B;

  --status-review-bg: #EEF2FF;
  --status-review-border: #C7D2FE;
  --status-review-text: #3730A3;

  /* Compact Radii */
  --r-xs: 3px;
  --r-sm: 4px;
  --r-md: 6px;

  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.05);
  --shadow-modal: 0 10px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
}

/* Office Dark Slate Theme */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app: #0B0F19;
    --bg-surface: #111827;
    --bg-subtle: #1F2937;
    --bg-hover: #374151;

    --border-subtle: #1F2937;
    --border-strong: #374151;
    --border-focus: #38BDF8;

    --text-main: #F9FAFB;
    --text-muted: #9CA3AF;
    --text-subtle: #6B7280;
    --text-inverse: #111827;

    --brand-primary: #0284C7;
    --brand-hover: #38BDF8;

    --status-ok-bg: #064E3B;
    --status-ok-border: #047857;
    --status-ok-text: #A7F3D0;

    --status-warn-bg: #78350F;
    --status-warn-border: #B45309;
    --status-warn-text: #FDE68A;

    --status-bad-bg: #7F1D1D;
    --status-bad-border: #B91C1C;
    --status-bad-text: #FECACA;

    --status-review-bg: #312E81;
    --status-review-border: #4338CA;
    --status-review-text: #E0E7FF;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg-app: #0B0F19;
  --bg-surface: #111827;
  --bg-subtle: #1F2937;
  --bg-hover: #374151;

  --border-subtle: #1F2937;
  --border-strong: #374151;
  --border-focus: #38BDF8;

  --text-main: #F9FAFB;
  --text-muted: #9CA3AF;
  --text-subtle: #6B7280;
  --text-inverse: #111827;

  --brand-primary: #0284C7;
  --brand-hover: #38BDF8;

  --status-ok-bg: #064E3B;
  --status-ok-border: #047857;
  --status-ok-text: #A7F3D0;

  --status-warn-bg: #78350F;
  --status-warn-border: #B45309;
  --status-warn-text: #FDE68A;

  --status-bad-bg: #7F1D1D;
  --status-bad-border: #B91C1C;
  --status-bad-text: #FECACA;

  --status-review-bg: #312E81;
  --status-review-border: #4338CA;
  --status-review-text: #E0E7FF;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg-app: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --bg-hover: #E2E8F0;

  --border-subtle: #E2E8F0;
  --border-strong: #CBD5E1;
  --border-focus: #0284C7;

  --text-main: #0F172A;
  --text-muted: #475569;
  --text-subtle: #64748B;
  --text-inverse: #FFFFFF;

  --brand-primary: #0284C7;
  --brand-hover: #0369A1;

  --status-ok-bg: #F0FDF4;
  --status-ok-border: #BBF7D0;
  --status-ok-text: #166534;

  --status-warn-bg: #FFFBEB;
  --status-warn-border: #FDE68A;
  --status-warn-text: #92400E;

  --status-bad-bg: #FEF2F2;
  --status-bad-border: #FECACA;
  --status-bad-text: #991B1B;

  --status-review-bg: #EEF2FF;
  --status-review-border: #C7D2FE;
  --status-review-text: #3730A3;
  color-scheme: light;
}

/* Base Reset */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  min-height: 100vh;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: none;
  outline: none;
  background: transparent;
}
button { cursor: pointer; user-select: none; }
:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }

h1, h2, h3, h4, h5 {
  font-weight: 600;
  margin: 0;
  color: var(--text-main);
}
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

/* Layout Shell */
.app-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 1600px;
  margin: 0 auto;
  padding: 0 20px 48px;
}

/* Office Top Bar */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 16px;
}
.nav-left {
  display: flex;
  align-items: center;
  gap: 20px;
}
.nav-brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.nav-brand-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-main);
}
.nav-brand-sub {
  font-size: 11.5px;
  color: var(--text-subtle);
  font-weight: 500;
}

/* Workspaces Tabs */
.view-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-subtle);
  padding: 2px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-subtle);
}
.view-tab-btn {
  padding: 5px 12px;
  border-radius: var(--r-xs);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  transition: all 0.1s ease;
}
.view-tab-btn:hover { color: var(--text-main); }
.view-tab-btn[aria-pressed="true"] {
  background: var(--bg-surface);
  color: var(--text-main);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* Nav Right Cluster */
.nav-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sim-clock-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-subtle);
  padding: 3px 6px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-subtle);
  font-size: 11.5px;
}
.sim-clock-date {
  font-weight: 600;
  padding: 0 4px;
}
.sim-btn {
  padding: 2px 6px;
  border-radius: var(--r-xs);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
}
.sim-btn:hover {
  background: var(--bg-hover);
  color: var(--text-main);
}

.user-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  font-size: 11.5px;
}
.user-avatar {
  width: 18px;
  height: 18px;
  border-radius: var(--r-xs);
  background: var(--text-muted);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 700;
}

/* Office KPI Metrics Strip */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.kpi-tile {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  box-shadow: var(--shadow-card);
}
.kpi-tile-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-subtle);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  display: flex;
  justify-content: space-between;
}
.kpi-tile-val {
  font-size: 19px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.kpi-tile-meta {
  font-size: 11px;
  color: var(--text-muted);
}

/* Workbench Grid (Left Queue + Right Dossier) */
.workbench-grid {
  display: grid;
  grid-template-columns: 310px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

/* Queue Panel (Left) */
.queue-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.queue-top {
  padding: 12px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.queue-search-input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-xs);
  background: var(--bg-subtle);
  font-size: 12px;
  color: var(--text-main);
}
.queue-search-input:focus {
  background: var(--bg-surface);
  border-color: var(--border-focus);
}

.queue-filter-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.queue-select {
  width: 100%;
  padding: 4px 8px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-xs);
  background: var(--bg-subtle);
  font-size: 11.5px;
  font-weight: 500;
}

.queue-pills {
  display: flex;
  gap: 3px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.queue-pill {
  padding: 3px 7px;
  border-radius: var(--r-xs);
  font-size: 11px;
  font-weight: 500;
  background: var(--bg-subtle);
  color: var(--text-muted);
  white-space: nowrap;
}
.queue-pill:hover { color: var(--text-main); }
.queue-pill[aria-pressed="true"] {
  background: var(--text-main);
  color: var(--text-inverse);
  font-weight: 600;
}

.queue-items {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 220px);
  overflow-y: auto;
}
.queue-item {
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background 0.05s ease;
}
.queue-item:hover { background: var(--bg-subtle); }
.queue-item[aria-current="true"] {
  background: var(--bg-subtle);
  border-left: 3px solid var(--brand-primary);
}

.queue-item-r1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.queue-item-title {
  font-weight: 600;
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.queue-item-r2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
}

/* Badge styles */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: var(--r-xs);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
}
.badge.ok { background: var(--status-ok-bg); color: var(--status-ok-text); border: 1px solid var(--status-ok-border); }
.badge.warn { background: var(--status-warn-bg); color: var(--status-warn-text); border: 1px solid var(--status-warn-border); }
.badge.bad { background: var(--status-bad-bg); color: var(--status-bad-text); border: 1px solid var(--status-bad-border); }
.badge.review { background: var(--status-review-bg); color: var(--status-review-text); border: 1px solid var(--status-review-border); }
.badge.neutral { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-subtle); }

/* Dossier Main View (Right) */
.dossier-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

/* Dossier Header */
.dossier-header {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  padding: 16px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dossier-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.dossier-meta-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.dossier-title-area h2 {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.015em;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.dossier-title-area p {
  font-size: 13px;
  color: var(--text-muted);
  margin: 3px 0 0;
}

/* Fast Action Bar */
.action-cluster {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: var(--r-xs);
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-surface);
  color: var(--text-main);
  border: 1px solid var(--border-strong);
  transition: all 0.05s ease;
}
.btn:hover {
  background: var(--bg-subtle);
  border-color: var(--text-subtle);
}
.btn.primary {
  background: var(--brand-primary);
  color: #FFFFFF;
  border-color: var(--brand-primary);
}
.btn.primary:hover {
  background: var(--brand-hover);
}
.btn.success {
  background: #15803D;
  color: #FFFFFF;
  border-color: #15803D;
}
.btn.danger {
  background: #B91C1C;
  color: #FFFFFF;
  border-color: #B91C1C;
}
.btn.small {
  padding: 3px 8px;
  font-size: 11.5px;
}

/* Verdict Summary Card */
.verdict-banner {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--brand-primary);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: var(--shadow-card);
}
.verdict-banner[data-status="approved"] { border-left-color: #16A34A; }
.verdict-banner[data-status="pending"] { border-left-color: #D97706; }
.verdict-banner[data-status="rejected"] { border-left-color: #DC2626; }

.verdict-left {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.verdict-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.verdict-word {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.verdict-desc {
  font-size: 13px;
  color: var(--text-muted);
  max-width: 72ch;
}

.verdict-stats {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  color: var(--text-muted);
}
.verdict-stat b {
  font-family: var(--font-mono);
  color: var(--text-main);
  font-size: 12.5px;
}

/* Dossier Tabs Navigation */
.dossier-nav-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 0;
}
.dossier-tab-btn {
  padding: 6px 12px;
  border-radius: var(--r-xs) var(--r-xs) 0 0;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-muted);
  border: 1px solid transparent;
  border-bottom: none;
  margin-bottom: -1px;
}
.dossier-tab-btn:hover { color: var(--text-main); }
.dossier-tab-btn[aria-pressed="true"] {
  background: var(--bg-surface);
  color: var(--text-main);
  font-weight: 600;
  border-color: var(--border-subtle);
  border-bottom: 1px solid var(--bg-surface);
}

/* Dossier Cards & Containers */
.office-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  padding: 16px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.office-card h3 {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.office-card .card-subtext {
  font-size: 12px;
  color: var(--text-subtle);
  margin-top: -8px;
}

.split-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* Table styles */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.data-table th {
  text-align: left;
  padding: 7px 10px;
  color: var(--text-subtle);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
}
.data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}
.data-table tr:hover td {
  background: var(--bg-subtle);
}

/* Controls trace */
.control-row {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-subtle);
  align-items: start;
}
.control-row:last-child { border-bottom: none; }
.control-glyph {
  width: 18px;
  height: 18px;
  border-radius: var(--r-xs);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
}
.control-glyph[data-o="pass"] { background: var(--status-ok-bg); color: var(--status-ok-text); }
.control-glyph[data-o="warn"] { background: var(--status-warn-bg); color: var(--status-warn-text); }
.control-glyph[data-o="required"] { background: #D97706; color: #FFFFFF; }
.control-glyph[data-o="review"] { background: #4F46E5; color: #FFFFFF; }
.control-glyph[data-o="block"] { background: #DC2626; color: #FFFFFF; }
.control-glyph[data-o="skipped"] { background: var(--bg-subtle); color: var(--text-subtle); }

/* Email preview container */
.email-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.email-meta {
  display: grid;
  grid-template-columns: 60px minmax(0, 1fr);
  gap: 4px 10px;
  font-size: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-subtle);
}
.email-body {
  white-space: pre-wrap;
  font-size: 12.5px;
  line-height: 1.55;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-xs);
  padding: 10px 12px;
  max-height: 340px;
  overflow-y: auto;
  font-family: var(--font-sans);
}

/* Modal styles */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(15, 23, 42, 0.5);
  display: grid;
  place-items: center;
  padding: 20px;
}
.modal-box {
  width: 100%;
  max-width: 600px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-modal);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Toast Hub */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.toast-msg {
